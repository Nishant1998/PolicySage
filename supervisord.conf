[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/policysage-supervisord.pid
childlogdir=/tmp

[program:web]
command=/app/.venv/bin/uvicorn app.main:app --no-access-log --host 0.0.0.0 --port %(ENV_PORT)s --workers 1
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker]
command=/app/.venv/bin/python -m app.ingestion worker --watch
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

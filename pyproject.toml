[project]
name = "policysage"
version = "0.1.0"
description = "Insurance Policy & Claims Assistant"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.40,<2",
    "botocore>=1.43.125,<2",
    "docling>=2.142.1",
    "fastapi>=0.155.0",
    "fonttools>=4.67.0",
    "qdrant-client>=1.20.0",
    "httpx",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langsmith>=0.14.11",
    "numpy>=2.4.6",
    "openai>=3.35.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.1",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers>=5.20.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
